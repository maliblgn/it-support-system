[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "destek-takip-backend"
version = "0.7.0"
description = "Rol tabanlı teknik destek ve talep takip sistemi backend'i"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "pyodbc>=5,<6",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.29,<1",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
